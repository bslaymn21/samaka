<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>سمكة | الموقع مغلق</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            direction: rtl;
            font-family: Arial, 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: clamp(2rem, 7vw, 4rem);
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 20px;
        }
        p {
            color: #9ca3af;
            font-size: clamp(0.9rem, 3vw, 1.15rem);
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div>
        <h1>تم قفل الموقع نهائيا</h1>
        <p>الموقع متوقف عن العمل بشكل دائم، نشكر جميع عملائنا على دعمهم خلال الفترة الماضية.</p>
    </div>
</body>
</html>
