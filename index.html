<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>سمكة | الموقع مغلق</title>
    <link rel="icon" type="image/png" href="./assets/only logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #020617;
            color: #fff;
            direction: rtl;
            font-family: 'Work Sans', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow {
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.15);
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2.5s infinite;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 overflow-hidden">
    <!-- Animated background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-amber-500/20 blur-[120px] rounded-full animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-600/10 blur-[120px] rounded-full animate-pulse" style="animation-delay: 2s"></div>
    </div>

    <div class="w-full max-w-lg relative z-10 glow">
        <div class="glass-card rounded-[40px] shadow-2xl p-8 md:p-12 text-center overflow-y-auto no-scrollbar">
            <div class="mb-8">
                <img src="./assets/only logo.png" alt="Samaka Logo" class="h-24 w-auto mx-auto mb-6 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">
            </div>

            <span class="material-symbols-outlined text-6xl text-red-500 mb-6 animate-bounce-slow block">lock</span>

            <h1 class="text-4xl md:text-5xl font-black text-white mb-4 leading-tight">
                تم قفل الموقع نهائيا
            </h1>

            <p class="text-slate-400 text-sm md:text-base leading-relaxed">
                الموقع متوقف عن العمل بشكل دائم، نشكر جميع عملائنا على دعمهم خلال الفترة الماضية.
            </p>

            <div class="mt-8 pt-8 border-t border-white/5">
                <p class="text-slate-600 text-[10px] font-bold uppercase tracking-tighter">&copy; 2026 SAMAKA &bull; CLOSED</p>
            </div>
        </div>
    </div>
</body>
</html>
