<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>سمكة | لدفع الاشتراك</title>
    <link rel="icon" type="image/png" href="../assets/only logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #020617;
            color: #fff;
            direction: rtl;
            font-family: 'Work Sans', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow {
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.2);
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }
        .animate-wiggle {
            animation: wiggle 1.5s ease-in-out infinite;
            display: inline-block;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 overflow-hidden">
    <!-- Animated background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-red-500/20 blur-[120px] rounded-full animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-amber-500/10 blur-[120px] rounded-full animate-pulse" style="animation-delay: 2s"></div>
    </div>

    <div class="w-full max-w-lg relative z-10 glow">
        <div class="glass-card rounded-[40px] shadow-2xl p-8 md:p-12 text-center">
            <div class="mb-8">
                <img src="../assets/only logo.png" alt="Samaka Logo" class="h-20 w-auto mx-auto mb-6 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">
            </div>

            <div class="mb-6">
                <span class="material-symbols-outlined text-7xl text-amber-500">payments</span>
            </div>

            <h1 class="text-4xl md:text-5xl font-black text-white mb-6 leading-tight">
                هاتوووووووو الفلوس الي عليكم
                <span class="animate-wiggle text-6xl align-middle">🤣</span>
            </h1>

            <p class="text-slate-400 text-sm md:text-base leading-relaxed">
                الموقع مقفول ومش هيفتح غير لما الفلوس تتسد 😉
            </p>

            <div class="mt-8 pt-8 border-t border-white/5">
                <p class="text-slate-600 text-[10px] font-bold uppercase tracking-tighter">&copy; 2026 SAMAKA &bull; PAYMENT REQUIRED</p>
            </div>
        </div>
    </div>
</body>
</html>
